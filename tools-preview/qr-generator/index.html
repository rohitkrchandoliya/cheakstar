<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - Cheakstar Tools</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #111; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
  #qrcode { margin-top: 1.5rem; }
  #qrcode img, #qrcode canvas { border: 1px solid #ddd; }
  .note { color: #555; font-size: 0.9rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>QR Code Generator</h1>
<p>Create a QR code for a link, text, Wi-Fi network, UPI ID, or contact card. Everything runs in your browser. Nothing is uploaded.</p>

<label for="mode">Type</label>
<select id="mode">
  <option value="text">Link or text</option>
  <option value="wifi">Wi-Fi network</option>
  <option value="upi">UPI ID</option>
  <option value="contact">Contact card (vCard)</option>
</select>

<div id="fields-text">
  <label for="input-text">Link or text</label>
  <textarea id="input-text" rows="3" placeholder="https://example.com"></textarea>
</div>

<div id="fields-wifi" hidden>
  <label for="wifi-ssid">Network name (SSID)</label>
  <input id="wifi-ssid" type="text" autocomplete="off">
  <label for="wifi-password">Password</label>
  <input id="wifi-password" type="text" autocomplete="off">
  <label for="wifi-auth">Security</label>
  <select id="wifi-auth">
    <option value="WPA">WPA / WPA2</option>
    <option value="WEP">WEP</option>
    <option value="nopass">No password</option>
  </select>
</div>

<div id="fields-upi" hidden>
  <label for="upi-id">UPI ID</label>
  <input id="upi-id" type="text" placeholder="name@bank" autocomplete="off">
  <label for="upi-name">Payee name (optional)</label>
  <input id="upi-name" type="text" autocomplete="off">
</div>

<div id="fields-contact" hidden>
  <label for="contact-name">Full name</label>
  <input id="contact-name" type="text" autocomplete="off">
  <label for="contact-phone">Phone (optional)</label>
  <input id="contact-phone" type="tel" autocomplete="off">
  <label for="contact-email">Email (optional)</label>
  <input id="contact-email" type="email" autocomplete="off">
</div>

<label for="size">Size (pixels)</label>
<select id="size">
  <option value="256">256</option>
  <option value="512" selected>512</option>
  <option value="1024">1024</option>
</select>

<label for="correction">Error correction</label>
<select id="correction">
  <option value="L">Low (L)</option>
  <option value="M" selected>Medium (M)</option>
  <option value="Q">Quartile (Q)</option>
  <option value="H">High (H)</option>
</select>

<div>
  <button id="generate" type="button">Generate QR code</button>
  <button id="download" type="button" disabled>Download PNG</button>
  <button id="download-svg" type="button" disabled>Download SVG</button>
</div>

<div id="qrcode" aria-live="polite"></div>
<p class="note">Tip: test the code with your phone camera before printing or sharing it.</p>
<p id="status" class="note" role="status"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
var modeEl = document.getElementById("mode");
var statusEl = document.getElementById("status");
var downloadBtn = document.getElementById("download");
var downloadSvgBtn = document.getElementById("download-svg");
var qrBox = document.getElementById("qrcode");
var currentQr = null;

function showFields() {
  var mode = modeEl.value;
  ["text", "wifi", "upi", "contact"].forEach(function (name) {
    document.getElementById("fields-" + name).hidden = (name !== mode);
  });
}

function escapeValue(value) {
  return value.replace(/([\\;,:\"])/g, "\\$1");
}

function buildPayload() {
  var mode = modeEl.value;
  if (mode === "wifi") {
    var ssid = document.getElementById("wifi-ssid").value.trim();
    var password = document.getElementById("wifi-password").value;
    var auth = document.getElementById("wifi-auth").value;
    if (!ssid) { return { error: "Enter a network name (SSID)." }; }
    return { value: "WIFI:T:" + auth + ";S:" + escapeValue(ssid) + ";P:" + escapeValue(password) + ";;" };
  }
  if (mode === "upi") {
    var upiId = document.getElementById("upi-id").value.trim();
    var payee = document.getElementById("upi-name").value.trim();
    if (!upiId) { return { error: "Enter a UPI ID." }; }
    var payload = "upi://pay?pa=" + encodeURIComponent(upiId);
    if (payee) { payload += "&pn=" + encodeURIComponent(payee); }
    return { value: payload };
  }
  if (mode === "contact") {
    var name = document.getElementById("contact-name").value.trim();
    var phone = document.getElementById("contact-phone").value.trim();
    var email = document.getElementById("contact-email").value.trim();
    if (!name && !phone && !email) { return { error: "Enter at least a name, phone number, or email." }; }
    var lines = ["BEGIN:VCARD", "VERSION:3.0"];
    if (name) { lines.push("FN:" + name); }
    if (phone) { lines.push("TEL:" + phone); }
    if (email) { lines.push("EMAIL:" + email); }
    lines.push("END:VCARD");
    return { value: lines.join("\n") };
  }
  var text = document.getElementById("input-text").value.trim();
  if (!text) { return { error: "Enter a link or some text." }; }
  return { value: text };
}

modeEl.addEventListener("change", showFields);

document.getElementById("generate").addEventListener("click", function () {
  if (typeof QRCode === "undefined") {
    statusEl.textContent = "The QR library could not be loaded. Check your connection and try again.";
    return;
  }
  var result = buildPayload();
  if (result.error) {
    statusEl.textContent = result.error;
    return;
  }
  qrBox.innerHTML = "";
  var size = parseInt(document.getElementById("size").value, 10);
  currentQr = new QRCode(qrBox, {
    text: result.value,
    width: size,
    height: size,
    correctLevel: QRCode.CorrectLevel[document.getElementById("correction").value]
  });
  downloadBtn.disabled = false;
  downloadSvgBtn.disabled = false;
  statusEl.textContent = "QR code generated.";
});

downloadBtn.addEventListener("click", function () {
  var image = qrBox.querySelector("img") || qrBox.querySelector("canvas");
  if (!image) { return; }
  var link = document.createElement("a");
  link.download = "qr-code.png";
  if (image.tagName === "CANVAS") {
    link.href = image.toDataURL("image/png");
  } else {
    link.href = image.src;
  }
  link.click();
});

function buildSvgString(qrModel) {
  // qrModel is the module matrix the QR library already computed for the
  // on-screen code (getModuleCount / isDark). A 4-module quiet zone is
  // included so scanners can lock onto the code.
  var count = qrModel.getModuleCount();
  var quiet = 4;
  var total = count + quiet * 2;
  var path = "";
  for (var row = 0; row < count; row++) {
    for (var col = 0; col < count; col++) {
      if (qrModel.isDark(row, col)) {
        path += "M" + (col + quiet) + " " + (row + quiet) + "h1v1h-1z";
      }
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + " " + total + '" width="512" height="512">'
    + '<rect width="' + total + '" height="' + total + '" fill="#ffffff"/>'
    + '<path d="' + path + '" fill="#000000"/></svg>';
}

downloadSvgBtn.addEventListener("click", function () {
  if (!currentQr || !currentQr._oQRCode) {
    statusEl.textContent = "Generate a QR code first.";
    return;
  }
  var svg = buildSvgString(currentQr._oQRCode);
  var blob = new Blob([svg], { type: "image/svg+xml" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.download = "qr-code.svg";
  link.href = url;
  link.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
});
</script>
</body>
</html>
